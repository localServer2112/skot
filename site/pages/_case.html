<section class="phero">
  <div class="shell" style="padding:0">
    <div class="phero-grid">
      <div class="phero-main">
        <span class="eyebrow">Case study</span>
        <h1 class="h1">{{TITLE}}</h1>
      </div>
      <div class="phero-side">
        <p class="lede">{{SUMMARY}}</p>
        <div>
          <p class="label">Client</p>
          <p class="t-ui" style="margin-top:.5rem">{{CLIENT}}</p>
        </div>
      </div>
    </div>
  </div>
</section>

<div class="bleed">
  <div class="card-panel {{PANEL}}" style="aspect-ratio:auto;height:clamp(200px,26vw,320px);align-items:center;justify-content:center;padding:2rem">
    {{CASE_MARK}}
  </div>
  <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

{{METRICS}}

<section class="sec" style="padding-block:0;border-bottom:0">
  <div class="shell">
    <div class="case-sections">
      <h2>The challenge</h2>
      <div class="body-copy">{{CHALLENGE}}</div>
    </div>
    <div class="case-sections">
      <h2>Our approach</h2>
      <div class="body-copy">{{APPROACH}}</div>
    </div>
    <div class="case-sections">
      <h2>The impact</h2>
      <div class="body-copy">{{IMPACT}}</div>
    </div>
    <div class="case-sections">
      <h2>The SKOT contribution</h2>
      <div class="quote-accent"><p class="contrib">{{CONTRIBUTION}}</p></div>
    </div>
  </div>
</section>

<section class="sec" style="border-bottom:0">
  <div class="shell">
    <div class="sec-head">
      <div>
        <p class="label">Next</p>
        <h2 class="h2" style="margin-top:1rem">More selected work.</h2>
      </div>
      <a class="alink alink--accent" href="case-studies.html">All case studies {{ARROW}}</a>
    </div>
    <div class="card-grid">{{NEXT_CASES}}</div>
  </div>
</section>
