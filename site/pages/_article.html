<section class="phero">
  <div class="shell" style="padding:0">
    <div class="phero-grid">
      <div class="phero-main">
        <span class="eyebrow">Insights</span>
        <h1 class="h2">{{TITLE}}</h1>
      </div>
      <div class="phero-side">
        <p class="lede">{{EXCERPT}}</p>
        <div>
          <p class="label">Reading time</p>
          <p class="t-ui" style="margin-top:.5rem">{{MINUTES}} min</p>
        </div>
      </div>
    </div>
  </div>
</section>

{{HERO_MEDIA}}

<article class="sec" style="border-bottom:0">
  <div class="shell">
    <div class="article-grid">
      <div class="article-meta">
        <p class="label">Published</p>
        <p class="t-ui" style="margin-top:.5rem">{{DATE_LONG}}</p>
        <p class="label" style="margin-top:1.5rem">Category</p>
        <p class="t-ui" style="margin-top:.5rem">{{CATEGORY}}</p>
        <p class="label" style="margin-top:1.5rem">Share</p>
        <div style="display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap">
          <a class="chip" href="{{LINKEDIN_SHARE}}" target="_blank" rel="noopener">LinkedIn</a>
          <a class="chip" href="mailto:?subject={{TITLE_ENC}}">Email</a>
        </div>
      </div>
      <div class="prose">{{CONTENT}}</div>
    </div>
  </div>
</article>

<section class="sec" style="border-bottom:0">
  <div class="shell">
    <div class="sec-head">
      <div>
        <p class="label">Keep reading</p>
        <h2 class="h2" style="margin-top:1rem">More insights.</h2>
      </div>
      <a class="alink alink--accent" href="insights.html">All insights {{ARROW}}</a>
    </div>
    <div class="post-grid">{{RELATED}}</div>
  </div>
</section>
