<section class="phero">
  <div class="shell" style="padding:0">
    <div class="phero-grid">
      <div class="phero-main">
        <span class="eyebrow">Expertise</span>
        <h1 class="h1">{{TITLE}}</h1>
      </div>
      <div class="phero-side">
        <p class="lede">{{LEDE}}</p>
        <a class="btn btn-solid" href="contact.html">Talk to our team {{ARROW}}</a>
      </div>
    </div>
  </div>
</section>

<div class="bleed">
  <img src="{{IMAGE}}" alt="{{ALT}}" loading="eager">
  <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<section class="sec">
  <div class="shell">
    <div class="sec-split">
      <div><p class="label">Our view</p></div>
      <div><p class="h4">{{BODY}}</p></div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="shell">
    <div class="sec-head">
      <div>
        <p class="label">Capabilities</p>
        <h2 class="h2" style="margin-top:1rem">What this covers.</h2>
      </div>
    </div>
    <ul class="caps">{{CAPS}}</ul>
  </div>
</section>

<section class="sec" style="border-bottom:0">
  <div class="shell">
    <div class="sec-head">
      <div>
        <p class="label">Related work</p>
        <h2 class="h2" style="margin-top:1rem">This discipline, in practice.</h2>
      </div>
      <a class="btn btn-ghost btn-sm" href="case-studies.html">All case studies {{ARROW}}</a>
    </div>
    <div class="card-grid">{{RELATED}}</div>
    <nav class="sec-split" style="margin-top:clamp(2.5rem,5vw,4rem);align-items:center">
      <div><p class="label">More expertise</p></div>
      <div style="display:flex;flex-wrap:wrap;gap:.5rem">{{SIBLINGS}}</div>
    </nav>
  </div>
</section>
