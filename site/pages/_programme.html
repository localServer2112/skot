<div class="prog prog--{{SLUG}}">
<section class="phero">
  <div class="shell" style="padding:0">
    <div class="phero-grid">
      <div class="phero-main">
        <span class="eyebrow">Programmes</span>
        <h1 class="h1">{{NAME}}</h1>
      </div>
      <div class="phero-side">
        <p class="lede">{{LEDE}}</p>
        <a class="btn btn-solid" href="contact.html">{{CTA}} {{ARROW}}</a>
      </div>
    </div>
  </div>
</section>

<div class="bleed">
  <img src="{{IMAGE}}" alt="{{ALT}}" loading="eager">
  <div class="spectrum" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
</div>

<section class="sec">
  <div class="shell">
    <div class="sec-split">
      <div>
        <p class="label">About the programme</p>
        <p class="h4" style="margin-top:1.5rem">{{BODY}}</p>
      </div>
      <div><div class="facts">{{FACTS}}</div></div>
    </div>
  </div>
</section>

{{ACADEMY_SECTION}}

{{MASTERCLASS_SECTION}}
</div>
